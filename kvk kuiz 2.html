<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Latihan Ejaan Jawi</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef7ff, #ffffff);
    min-height: 100vh;
    color: #222;
}

.container {
    width: 95%;
    max-width: 1100px;
    margin: 20px auto;
}

/* =========================
   HEADER
========================= */

.header {
    background: #1769aa;
    color: white;
    text-align: center;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

.header h1 {
    margin: 0;
    font-size: 32px;
}

.header p {
    margin: 8px 0 0;
    font-size: 18px;
}

/* =========================
   INFO BAR
========================= */

.info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;

    background: white;
    margin-top: 15px;
    padding: 12px 20px;

    border-radius: 12px;

    box-shadow: 0 3px 10px rgba(0,0,0,0.08);

    font-size: 18px;
    font-weight: bold;
}

#questionNumber {
    color: #1769aa;
}

#score {
    color: #16803c;
}

/* =========================
   KUIZ
========================= */

.question-area {
    background: white;

    margin-top: 20px;
    padding: 30px;

    border-radius: 18px;

    box-shadow: 0 5px 15px rgba(0,0,0,0.10);

    text-align: center;
}

.instruction {
    font-size: 20px;
    margin-bottom: 25px;
    font-weight: bold;
}

/* =========================
   PERKATAAN RUMI
========================= */

.box-label {
    font-size: 17px;
    margin-bottom: 10px;
    font-weight: bold;
}

.word-boxes {
    display: flex;
    justify-content: center;
    gap: 10px;

    margin: 20px auto 35px;

    flex-wrap: wrap;
}

.word-box {
    min-width: 70px;
    width: 80px;
    height: 80px;

    border: 3px solid #1769aa;
    border-radius: 12px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 35px;
    font-weight: bold;

    background: #eef7ff;
}

/* =========================
   KOTAK JAWI
========================= */

.answer-boxes {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 10px;

    margin: 15px auto 30px;

    flex-wrap: wrap;

    direction: rtl;
}

.answer-box {
    width: 75px;
    height: 80px;

    border: 3px dashed #888;
    border-radius: 12px;

    background: #fafafa;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        "Noto Naskh Arabic",
        "Traditional Arabic",
        Arial,
        sans-serif;

    font-size: 42px;

    cursor: pointer;

    transition: 0.2s;
}

.answer-box:hover {
    background: #eef7ff;
    border-color: #1769aa;
}

.answer-box.selected {
    border-color: #1769aa;
    background: #dff0ff;
}

/* =========================
   PILIHAN HURUF
========================= */

.main-content {
    display: flex;
    gap: 20px;
    align-items: stretch;
}

.choices-area {
    width: 100%;

    background: #f8f8f8;

    border-radius: 15px;

    padding: 20px;

    border: 2px solid #ddd;
}

.choices-title {
    font-size: 19px;
    font-weight: bold;

    margin-bottom: 15px;

    text-align: center;
}

.choices {
    display: grid;

    grid-template-columns:
        repeat(8, 1fr);

    gap: 10px;
}

.jawi-choice {
    height: 65px;

    border: 2px solid #1769aa;

    border-radius: 10px;

    background: white;

    font-family:
        "Noto Naskh Arabic",
        "Traditional Arabic",
        Arial,
        sans-serif;

    font-size: 36px;

    cursor: pointer;

    transition: 0.2s;
}

.jawi-choice:hover {
    background: #dff0ff;

    transform: scale(1.04);
}

.jawi-choice.active {
    background: #1769aa;
    color: white;
}

.jawi-choice.used {
    visibility: hidden;
}

/* =========================
   BUTANG
========================= */

.button-area {
    margin-top: 25px;

    display: flex;
    justify-content: center;

    gap: 15px;

    flex-wrap: wrap;
}

.check-btn {
    background: #16803c;

    color: white;

    border: none;

    padding: 14px 35px;

    font-size: 19px;

    font-weight: bold;

    border-radius: 10px;

    cursor: pointer;
}

.check-btn:hover {
    background: #0f612d;
}

.check-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.reset-btn {
    background: #777;

    color: white;

    border: none;

    padding: 14px 35px;

    font-size: 19px;

    font-weight: bold;

    border-radius: 10px;

    cursor: pointer;
}

.reset-btn:hover {
    background: #555;
}

/* =========================
   FEEDBACK
========================= */

.feedback {
    min-height: 35px;

    margin-top: 18px;

    font-size: 20px;

    font-weight: bold;
}

.feedback.correct {
    color: #16803c;
}

.feedback.wrong {
    color: #c62828;
}

/* =========================
   KEPUTUSAN
========================= */

.result-screen {
    display: none;

    background: white;

    margin-top: 25px;

    padding: 45px 25px;

    border-radius: 18px;

    text-align: center;

    box-shadow: 0 5px 15px rgba(0,0,0,0.12);
}

.result-screen h2 {
    font-size: 32px;

    color: #1769aa;

    margin-top: 0;
}

.final-score {
    font-size: 60px;

    font-weight: bold;

    color: #16803c;

    margin: 20px;
}

.result-message {
    font-size: 22px;

    margin-bottom: 25px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .header h1 {
        font-size: 25px;
    }

    .header p {
        font-size: 16px;
    }

    .info-bar {
        font-size: 15px;
    }

    .word-box {
        min-width: 55px;
        width: 60px;
        height: 60px;

        font-size: 27px;
    }

    .answer-box {
        width: 60px;
        height: 65px;

        font-size: 35px;
    }

    .choices {
        grid-template-columns:
            repeat(5, 1fr);
    }

    .jawi-choice {
        height: 55px;
        font-size: 30px;
    }

}

/* =========================
   PAPARAN KUIZ
========================= */

.quiz-screen {
    display: block;
}

</style>
</head>

<script>

/* =====================================================
   DATA 30 PERKATAAN
===================================================== */

const questions = [

    {
        rumi: ["B","A","T","U"],
        jawi: ["ب","ا","ت","و"]
    },

    {
        rumi: ["B","A","J","U"],
        jawi: ["ب","ا","ج","و"]
    },

    {

        jawi: ["ب","و","ک","و"]

    {

    {

    {

    },

    {
        rumi: ["M","A","T","A"],
        jawi: ["م","ا","ت","ا"]
    },

    {
        rumi: ["M","A","K","A","N"],
        jawi: ["م","ا","ک","ن"]
    },

    {
        rumi: ["M","A","S","A"],
        jawi: ["م","ا","س","ا"]
    },

    {
        rumi: ["M","A","L","A","M"],
        jawi: ["م","ا","ل","م"]
    },

    {
        rumi: ["T","A","M","A","N"],
        jawi: ["ت","ا","م","ن"]
    },

    {
        rumi: ["T","A","N","A","H"],
        jawi: ["ت","ا","ن","ه"]
    },

    {
        rumi: ["I","K","A","N"],
        jawi: ["ا","ي","ک","ن"]
    },

    {
        rumi: ["A","Y","A","M"],
        jawi: ["ا","ي","م"]
    },

    {
        rumi: ["A","T","A","P"],
        jawi: ["ا","ت","ڤ"]
    },

    {
        rumi: ["A","P","I"],
        jawi: ["ا","ڤ","ي"]
    },

    {
        rumi: ["U","L","A","R"],
        jawi: ["ا","و","ل","ر"]
    },

    {
        rumi: ["R","U","M","A","H"],
        jawi: ["ر","و","م","ه"]
    },

    {
        rumi: ["S","U","S","U"],
        jawi: ["س","و","س","و"]
    },

    {
        rumi: ["G","U","R","U"],
        jawi: ["ݢ","و","ر","و"]
    },

    {
        rumi: ["M","E","J","A"],
        jawi: ["م","ي","ج","ا"]
    },

    {
        rumi: ["K","E","R","U","S","I"],
        jawi: ["ک","ر","و","س","ي"]
    },

    {
        rumi: ["B","I","L","I","K"],
        jawi: ["ب","ي","ل","ي","ق"]
    },

    {
        rumi: ["P","A","P","A","N"],
        jawi: ["ڤ","ا","ڤ","ن"]
    },

    {
        rumi: ["B","A","J","U"],
        jawi: ["ب","ا","ج","و"]
    },

    {
        rumi: ["P","A","S","U"],
        jawi: ["ڤ","ا","س","و"]
    },

    {
        rumi: ["J","A","L","A","N"],
        jawi: ["ج","ا","ل","ن"]
    },

    {
        rumi: ["S","E","K","O","L","A","H"],
        jawi: ["س","ک","و","ل","ه"]
    }

];


/* =====================================================
   SENARAI HURUF JAWI UNTUK PILIHAN
===================================================== */

const allJawiLetters = [

    "ا",
    "ب",
    "ت",
    "ث",
    "ج",
    "چ",
    "ح",
    "خ",
    "د",
    "ذ",
    "ر",
    "ز",
    "س",
    "ش",
    "ص",
    "ض",
    "ط",
    "ظ",
    "ع",
    "غ",
    "ف",
    "ڤ",
    "ق",
    "ک",
    "ݢ",
    "ل",
    "م",
    "ن",
    "و",
    "ه",
    "ي"

];


/* =====================================================
   PEMBOLEH UBAH
===================================================== */

let currentQuestion = 0;

let score = 0;

let selectedLetter = null;

let selectedButton = null;

let userAnswer = [];


/* =====================================================
   FUNGSI ACAK
===================================================== */

function shuffleArray(array) {

    let arr = [...array];

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [arr[i], arr[j]] =
            [arr[j], arr[i]];
    }

    return arr;
}


/* =====================================================
   PAPAR SOALAN
===================================================== */

function loadQuestion() {

    selectedLetter = null;

    selectedButton = null;

    userAnswer = [];


    document.getElementById("feedback").innerHTML = "";

    document.getElementById("feedback").className =
        "feedback";


    const q =
        questions[currentQuestion];


    /* -------------------------
       PAPAR NOMBOR SOALAN
    ------------------------- */

    document.getElementById("questionNumber").innerHTML =
        "Soalan " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    /* -------------------------
       PAPAR MARKAH
    ------------------------- */

    document.getElementById("score").innerHTML =
        "Markah: " + score;


    /* -------------------------
       PAPAR PERKATAAN RUMI
    ------------------------- */

    const wordBoxes =
        document.getElementById("wordBoxes");

    wordBoxes.innerHTML = "";


    q.rumi.forEach(letter => {

        const box =
            document.createElement("div");

        box.className = "word-box";

        box.innerHTML = letter;

        wordBoxes.appendChild(box);

    });


    /* -------------------------
       BINA KOTAK JAWAPAN JAWI
    ------------------------- */

    const answerBoxes =
        document.getElementById("answerBoxes");

    answerBoxes.innerHTML = "";


    q.jawi.forEach((letter, index) => {

        const box =
            document.createElement("div");

        box.className = "answer-box";

        box.id =
            "answerBox" + index;

        box.onclick = function() {

            placeAnswer(index);

        };

        answerBoxes.appendChild(box);

    });


    /* -------------------------
       BINA PILIHAN HURUF
    ------------------------- */

    generateChoices();

}


/* =====================================================
   BINA PILIHAN HURUF JAWI
===================================================== */

function generateChoices() {

    const choiceArea =
        document.getElementById("choices");

    choiceArea.innerHTML = "";


    /*
       Ambil semua huruf yang diperlukan
       untuk soalan semasa.
    */

    const correctLetters =
        questions[currentQuestion].jawi;


    /*
       Masukkan huruf jawapan yang betul.
    */

    let choices =
        [...correctLetters];


    /*
       Tambah huruf rawak supaya pilihan
       menjadi lebih mencabar.
    */

    const shuffledAll =
        shuffleArray(allJawiLetters);


    for (
        let letter of shuffledAll
    ) {

        if (choices.length >= 16) {
            break;
        }


        if (!choices.includes(letter)) {

            choices.push(letter);

        }

    }


    /*
       Acak semua pilihan.
    */

    choices =
        shuffleArray(choices);


    /*
       Paparkan butang.
    */

    choices.forEach(letter => {

        const btn =
            document.createElement("button");

        btn.className =
            "jawi-choice";

        btn.innerHTML =
            letter;


        btn.onclick = function() {

            /*
               Buang pilihan aktif
               daripada butang lain.
            */

            document
                .querySelectorAll(".jawi-choice")
                .forEach(b => {

                    b.classList.remove("active");

                });


            /*
               Pilih huruf.
            */

            btn.classList.add("active");

            selectedLetter =
                letter;

            selectedButton =
                btn;

        };


        choiceArea.appendChild(btn);

    });

}


/* =====================================================
   MULAKAN KUIZ
===================================================== */

loadQuestion();

/* =====================================================
   LETAK HURUF KE DALAM KOTAK
===================================================== */

function placeAnswer(boxIndex) {

    /*
       Pastikan murid pilih huruf dahulu.
    */

    if (selectedLetter === null) {

        const feedback =
            document.getElementById("feedback");

        feedback.innerHTML =
            "⚠️ Pilih satu huruf Jawi dahulu.";

        feedback.className =
            "feedback wrong";

        return;
    }


    /*
       Kalau kotak sudah ada huruf,
       jangan timpa.
    */

    if (
        userAnswer[boxIndex] &&
        userAnswer[boxIndex] !== ""
    ) {

        return;

    }


    /*
       Simpan jawapan murid.
    */

    userAnswer[boxIndex] =
        selectedLetter;


    /*
       Paparkan huruf dalam kotak.
    */

    const box =
        document.getElementById(
            "answerBox" + boxIndex
        );

    box.innerHTML =
        selectedLetter;

    box.classList.add("selected");


    /*
       Hilangkan huruf yang sudah dipilih
       daripada pilihan.
    */

    if (selectedButton) {

        selectedButton.classList.add("used");

    }


    /*
       Reset pilihan.
    */

    selectedLetter = null;

    selectedButton = null;


    document
        .querySelectorAll(".jawi-choice")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    document.getElementById("feedback").innerHTML = "";

}


/* =====================================================
   SEMAK JAWAPAN
===================================================== */

function checkAnswer() {

    const correctAnswer =
        questions[currentQuestion].jawi;


    /*
       Pastikan semua kotak telah diisi.
    */

    for (
        let i = 0;
        i < correctAnswer.length;
        i++
    ) {

        if (
            !userAnswer[i] ||
            userAnswer[i] === ""
        ) {

            const feedback =
                document.getElementById(
                    "feedback"
                );

            feedback.innerHTML =
                "⚠️ Sila isi semua kotak dahulu.";

            feedback.className =
                "feedback wrong";

            return;

        }

    }


    /*
       Semak setiap huruf.
    */

    let correct = true;


    for (
        let i = 0;
        i < correctAnswer.length;
        i++
    ) {

        if (
            userAnswer[i] !==
            correctAnswer[i]
        ) {

            correct = false;

            break;

        }

    }


    /* =========================
       JAWAPAN BETUL
    ========================= */

    if (correct) {

        score++;


        document.getElementById("score").innerHTML =
            "Markah: " + score;


        const feedback =
            document.getElementById(
                "feedback"
            );


        feedback.innerHTML =
            "✅ Betul! Syabas!";


        feedback.className =
            "feedback correct";


        /*
           Matikan butang semak sementara.
        */

        const checkButton =
            document.querySelector(
                ".check-btn"
            );

        checkButton.disabled = true;


        /*
           Tunggu 1.2 saat sebelum
           pergi ke soalan seterusnya.
        */

        setTimeout(function() {

            currentQuestion++;


            /*
               Masih ada soalan.
            */

            if (
                currentQuestion <
                questions.length
            ) {

                checkButton.disabled =
                    false;

                loadQuestion();

            }


            /*
               Semua soalan sudah habis.
            */

            else {

                showResult();

            }

        }, 1200);

    }


    /* =========================
       JAWAPAN SALAH
    ========================= */

    else {

        const feedback =
            document.getElementById(
                "feedback"
            );


        feedback.innerHTML =
            "❌ Jawapan belum betul. Cuba lagi!";


        feedback.className =
            "feedback wrong";

    }

}


/* =====================================================
   PAPAR KEPUTUSAN AKHIR
===================================================== */

function showResult() {

    /*
       Sembunyikan kuiz.
    */

    document.getElementById(
        "quizScreen"
    ).style.display = "none";


    /*
       Paparkan keputusan.
    */

    document.getElementById(
        "resultScreen"
    ).style.display = "block";


    /*
       Paparkan markah.
    */

    document.getElementById(
        "finalScore"
    ).innerHTML =
        score +
        " / " +
        questions.length;


    /*
       Kira peratus.
    */

    const percentage =
        (score / questions.length) * 100;


    let message = "";


    if (percentage === 100) {

        message =
            "🏆 Hebat! Semua jawapan betul!";

    }

    else if (percentage >= 80) {

        message =
            "🌟 Syabas! Pencapaian sangat baik!";

    }

    else if (percentage >= 60) {

        message =
            "👏 Bagus! Teruskan latihan.";

    }

    else if (percentage >= 40) {

        message =
            "💪 Bagus mencuba! Teruskan berlatih.";

    }

    else {

        message =
            "📚 Teruskan berlatih Jawi. Kamu boleh buat lebih baik!";

    }


    document.getElementById(
        "resultMessage"
    ).innerHTML =
        message;

}


/* =====================================================
   BUAT SEMULA
===================================================== */

function resetQuiz() {

    /*
       Reset semua pembolehubah.
    */

    currentQuestion = 0;

    score = 0;

    selectedLetter = null;

    selectedButton = null;

    userAnswer = [];


    /*
       Paparkan semula skrin kuiz.
    */

    document.getElementById(
        "quizScreen"
    ).style.display = "block";


    /*
       Sembunyikan keputusan.
    */

    document.getElementById(
        "resultScreen"
    ).style.display = "none";


    /*
       Aktifkan semula butang semak.
    */

    document.querySelector(
        ".check-btn"
    ).disabled = false;


    /*
       Kosongkan maklum balas.
    */

    document.getElementById(
        "feedback"
