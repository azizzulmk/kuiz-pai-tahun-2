<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kuiz Rumi ke Jawi</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef7ff, #ffffff);
    min-height: 100vh;
    color: #222;
}

.container {
    width: 95%;
    max-width: 900px;
    margin: 25px auto;
}

/* HEADER */

.header {
    background: #1769aa;
    color: white;
    text-align: center;
    padding: 25px 15px;
    border-radius: 18px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

.header h1 {
    margin: 0;
    font-size: 32px;
}

.header p {
    margin: 8px 0 0;
    font-size: 18px;
}

/* INFO */

.info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: white;
    margin-top: 15px;
    padding: 15px 20px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    font-size: 18px;
    font-weight: bold;
}

#questionNumber {
    color: #1769aa;
}

#score {
    color: #16803c;
}

/* QUIZ */

.quiz-area {
    background: white;
    margin-top: 20px;
    padding: 35px 25px;
    border-radius: 18px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.10);
    text-align: center;
}

.instruction {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

/* RUMI */

.rumi-word {
    display: inline-flex;
    justify-content: center;
    align-items: center;

    min-width: 230px;

    padding: 18px 35px;

    background: #fff4cc;
    border: 3px solid #e0a800;
    border-radius: 15px;

    font-size: 42px;
    font-weight: bold;

    margin-bottom: 30px;
}

/* PILIHAN */

.choices {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 18px;

    max-width: 750px;

    margin: 0 auto;
}

.choice {
    position: relative;

    width: 100%;

    min-height: 120px;

    padding: 20px 15px 15px 60px;

    background: white;

    border: 3px solid #1769aa;

    border-radius: 15px;

    cursor: pointer;

    font-family:
        "Noto Naskh Arabic",
        "Traditional Arabic",
        Arial,
        sans-serif;

    font-size: 38px;

    direction: rtl;

    transition: 0.2s;
}

.choice:hover {
    background: #eef7ff;
    transform: scale(1.02);
}

.choice-label {
    position: absolute;

    left: 12px;
    top: 12px;

    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #1769aa;
    color: white;

    border-radius: 50%;

    font-family: Arial, sans-serif;

    font-size: 18px;
    font-weight: bold;

    direction: ltr;
}

.choice.correct {
    background: #dff5e7;
    border-color: #16803c;
}

.choice.correct .choice-label {
    background: #16803c;
}

.choice.wrong {
    background: #fde4e4;
    border-color: #c62828;
}

.choice.wrong .choice-label {
    background: #c62828;
}

.choice.disabled {
    cursor: default;
    transform: none;
}

/* FEEDBACK */

.feedback {
    min-height: 60px;

    margin-top: 25px;

    font-size: 22px;
    font-weight: bold;
}

.feedback.correct {
    color: #16803c;
}

.feedback.wrong {
    color: #c62828;
}

/* BUTTON */

.reset-btn {
    background: #777;
    color: white;

    border: none;

    padding: 14px 32px;

    font-size: 18px;
    font-weight: bold;

    border-radius: 10px;

    cursor: pointer;

    margin-top: 15px;
}

.reset-btn:hover {
    background: #555;
}

/* RESULT */

.result-screen {
    display: none;

    background: white;

    margin-top: 20px;

    padding: 45px 25px;

    border-radius: 18px;

    text-align: center;

    box-shadow: 0 5px 15px rgba(0,0,0,0.12);
}

.result-screen h2 {
    color: #1769aa;
    font-size: 32px;
}

.final-score {
    font-size: 60px;
    font-weight: bold;
    color: #16803c;
    margin: 20px;
}

.result-message {
    font-size: 22px;
    margin-bottom: 20px;
}

/* MOBILE */

@media (max-width: 650px) {

    .header h1 {
        font-size: 25px;
    }

    .info-bar {
        font-size: 15px;
    }

    .rumi-word {
        font-size: 34px;
        min-width: 180px;
    }

    .choices {
        grid-template-columns: 1fr;
    }

    .choice {
        min-height: 100px;
        font-size: 32px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

            Pilih ejaan Jawi yang betul
        </p>

    </div>


    <!-- SKRIN KUIZ -->

    <div id="quizScreen">

        <div class="info-bar">

            <div id="questionNumber">
                Soalan 1 / 30
            </div>

            <div id="score">
                Markah: 0
            </div>

        </div>


        <div class="quiz-area">

            <div class="instruction">
                Tukarkan perkataan berikut kepada tulisan Jawi.
            </div>


            <div
                class="rumi-word"
                id="rumiWord"
            >
                makan
            </div>


            <!-- PILIHAN A B C D -->

            <div
                class="choices"
                id="choices"
            >
            </div>


            <!-- FEEDBACK -->

            <div
                class="feedback"
                id="feedback"
            >
            </div>


            <!-- BUAT SEMULA -->

            <button
                class="reset-btn"
                onclick="resetQuiz()"
            >
                ↻ Buat Semula
            </button>

        </div>

    </div>


    <!-- SKRIN KEPUTUSAN -->

    <div
        class="result-screen"
        id="resultScreen"
    >

        <h2>
            🎉 Kuiz Tamat! 🎉

        <div
            class="final-score"

        >
            0 / 30

        <div

        >
        </div>

        <button

    </div>

    {

    {

    {

        ]
    },

    {
        rumi: "minum",
        correct: "مينوم",
        choices: [

        ]
    },

    {
        rumi: "senyum",
        correct: "سڽوم",
        choices: [
            "سڽوم",
            "سنيوم",
            "سڽم",
            "سنيام"
        ]
    }


];


/* =====================================================
   PEMBOLEH UBAH
===================================================== */

let currentQuestion = 0;
let score = 0;
let answered = false;


/* =====================================================
   ACAK PILIHAN
===================================================== */

function shuffle(array) {

    let result = [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] = [
            result[j],
            result[i]
        ];

    }

    return result;
}


/* =====================================================
   PAPAR SOALAN
===================================================== */

function loadQuestion() {

    answered = false;

    const question =
        questions[currentQuestion];


    document.getElementById(
        "questionNumber"
    ).textContent =
        "Soalan " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    document.getElementById(
        "score"
    ).textContent =
        "Markah: " +
        score;


    document.getElementById(
        "rumiWord"
    ).textContent =
        question.rumi;


    document.getElementById(
        "feedback"
    ).textContent = "";


    document.getElementById(
        "feedback"
    ).className =
        "feedback";


    createChoices(question);

}


/* =====================================================
   CIPTA PILIHAN A B C D
===================================================== */

function createChoices(question) {

    const choicesContainer =
        document.getElementById(
            "choices"
        );

    choicesContainer.innerHTML = "";


    const choices =
        shuffle(question.choices);


    const labels = [
        "A",
        "B",
        "C",
        "D"
    ];


    choices.forEach(
        function(choice, index) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "choice";


            button.innerHTML =

                '<span class="choice-label">' +
                labels[index] +
                '</span>' +

                '<span>' +
                choice +
                '</span>';


            button.addEventListener(
                "click",
                function() {

                    selectAnswer(
                        choice,
                        question.correct,
                        button
                    );

                }
            );


            choicesContainer.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   PILIH JAWAPAN
===================================================== */

function selectAnswer(
    selected,
    correct,
    selectedButton
) {

    if (answered) {
        return;
    }


    answered = true;


    const allButtons =
        document.querySelectorAll(
            ".choice"
        );


    allButtons.forEach(
        function(button) {

            button.classList.add(
                "disabled"
            );

            button.disabled = true;

        }
    );


    const feedback =
        document.getElementById(
            "feedback"
        );


    /* JAWAPAN BETUL */

    if (
        selected === correct
    ) {

        score++;


        selectedButton.classList.add(
            "correct"
        );


        feedback.textContent =
            "🎉 Tahniah! Jawapan anda betul.";

        feedback.className =
            "feedback correct";


        document.getElementById(
            "score"
        ).textContent =
            "Markah: " +
            score;

    }


    /* JAWAPAN SALAH */

    else {

        selectedButton.classList.add(
            "wrong"
        );


        feedback.innerHTML =
            "❌ Maaf, jawapan anda salah." +
            "<br>" +
            "Jawapan yang betul: " +
            correct;


        feedback.className =
            "feedback wrong";


        /*
           Tanda pilihan yang betul
           dengan warna hijau.
        */

        allButtons.forEach(
            function(button) {

                const buttonText =
                    button
                    .querySelector(
                        "span:last-child"
                    )
                    .textContent;


                if (
                    buttonText === correct
                ) {

                    button.classList.add(
                        "correct"
                    );

                }

            }
        );

    }


    /*
       Selepas 1.5 saat,
       pergi ke soalan berikutnya.
    */

    setTimeout(
        function() {

            currentQuestion++;


            if (
                currentQuestion <
                questions.length
            ) {

                loadQuestion();

            }

            else {

                showResult();

            }

        },
        1800
    );

}


/* =====================================================
   PAPAR KEPUTUSAN AKHIR
===================================================== */

function showResult() {

    document.getElementById(
        "quizScreen"
    ).style.display =
        "none";


    document.getElementById(
        "resultScreen"
    ).style.display =
        "block";


    document.getElementById(
        "finalScore"
    ).textContent =
        score +
        " / " +
        questions.length;


    const percentage =
        (
            score /
            questions.length
        ) * 100;


    let message = "";


    if (
        percentage === 100
    ) {

        message =
            "🏆 Cemerlang! Semua jawapan betul!";

    }

    else if (
        percentage >= 80
    ) {

        message =
            "🌟 Syabas! Pencapaian anda sangat baik!";

    }

    else if (
        percentage >= 60
    ) {

        message =
            "👏 Bagus! Teruskan berlatih.";

    }

    else {

        message =
            "💪 Teruskan berlatih dan cuba lagi.";

    }


    document.getElementById(
        "resultMessage"
    ).textContent =
        message;

}


/* =====================================================
   BUAT SEMULA
===================================================== */

function resetQuiz() {

    currentQuestion = 0;

    score = 0;

    answered = false;


    document.getElementById(
        "quizScreen"
    ).style.display =
        "block";


    document.getElementById(
        "resultScreen"
    ).style.display =
        "none";


    loadQuestion();

}


/* =====================================================
   MULAKAN KUIZ
===================================================== */

loadQuestion();

</script>
